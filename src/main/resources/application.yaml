server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://api-auth-def-v1-service-tmok01uc:8081
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/auth/**
                  - /api/v1/regions/**
                  - /api/v1/communes/**
                  - /api/v1/addresses/**