server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://smartsolutions-auth-alb-1154380074.sa-east-1.elb.amazonaws.com
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/auth/**
                  - /api/v1/regions/**
                  - /api/v1/communes/**
                  - /api/v1/addresses/**
                  - /api/v1/users/**
