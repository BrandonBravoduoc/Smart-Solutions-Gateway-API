server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://localhost:8081}

core:
  service:
    uri: ${CORE_SERVICE_URI:http://localhost:8082}

payment:
  service:
    uri: ${PAYMENT_SERVICE_URI:http://localhost:3000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${auth.service.uri}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/auth/**
                  - /api/v1/regions/**
                  - /api/v1/communes/**
                  - /api/v1/addresses/**
                  - /api/v1/users/**
        - id: core-service
          uri: ${core.service.uri}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/subscriptions/**
                  - /api/v1/plans/**
        - id: payment-service
          uri: ${payment.service.uri}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/payments/**

